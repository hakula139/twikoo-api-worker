name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: hakula139/devkit/actions/setup-nix@88f619538cc3a79bf223e538504251264e02b4e9

      - name: Run flake check
        run: nix flake check

  check:
    name: Worker Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: hakula139/devkit/actions/setup-nix@88f619538cc3a79bf223e538504251264e02b4e9

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Type check
        run: nix develop -c pnpm check

      - name: Format
        run: nix develop -c pnpm format

      - name: Lint
        run: nix develop -c pnpm lint

      - name: Spell check
        run: nix develop -c pnpm spellcheck

      - name: Test
        run: nix develop -c pnpm test --coverage

      - name: Runtime smoke test
        run: nix develop -c pnpm test:smoke

      - name: Bundle size check
        run: nix develop -c pnpm test:bundle

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [flake-check, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check results
        uses: hakula139/devkit/actions/ci-result@88f619538cc3a79bf223e538504251264e02b4e9
