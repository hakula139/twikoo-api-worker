name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_name: hakula
          cachix_skip_push: 'true'

      - name: Run flake check
        run: nix flake check

  check:
    name: Worker Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_name: hakula
          cachix_skip_push: 'true'

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Type check
        run: nix develop -c pnpm check

      - name: Format
        run: nix develop -c pnpm format

      - name: Lint
        run: nix develop -c pnpm lint

      - name: Spell check
        run: nix develop -c pnpm spellcheck

      - name: Test
        run: nix develop -c pnpm test --coverage

      - name: Runtime smoke test
        run: |
          EXPECTED_VERSION=$(jq -r .version node_modules/twikoo-func/package.json)
          SMOKE_LOG="${RUNNER_TEMP}/wrangler-smoke.log"
          WRANGLER_STATE="${RUNNER_TEMP}/wrangler-state"
          nix develop -c pnpm wrangler d1 execute twikoo --local \
            --persist-to "${WRANGLER_STATE}" \
            --file tests/fixtures/schema.sql
          nix develop -c pnpm wrangler dev --local --persist-to "${WRANGLER_STATE}" \
            --port 8787 > "${SMOKE_LOG}" 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "${WRANGLER_PID}" 2>/dev/null || true' EXIT
          if ! curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"event":"GET_FUNC_VERSION"}' \
            http://127.0.0.1:8787/ \
            | jq -e --arg version "${EXPECTED_VERSION}" '.code == 0 and .version == $version' > /dev/null; then
            cat "${SMOKE_LOG}"
            exit 1
          fi

      - name: Bundle size check
        run: |
          nix develop -c pnpm wrangler deploy --dry-run --outdir dist
          # Keep this aligned with the Workers Free plan's 3 MiB compressed limit.
          THRESHOLD=$((3 * 1024 * 1024))
          GZIPPED=$(gzip -c dist/worker.js | wc -c)
          echo "Compressed bundle: ${GZIPPED} bytes (threshold: ${THRESHOLD})"
          if [ "${GZIPPED}" -gt "${THRESHOLD}" ]; then
            echo "::error::Compressed bundle ${GZIPPED}B exceeds ${THRESHOLD}B threshold"
            exit 1
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
